<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 16" width="58" height="16" aria-hidden="true">

  <!-- Main stroke body — thick, blunt left, tapering right -->
  <path d="
    M 3,8
    C 2,5.5 3,3 5.5,2.5
    L 10,2 16,2.5 22,2 28,2.5 32,3.5 34,5.5
    L 34,10.5 32,12.5 28,13.5 22,14 16,13.5 10,14 5.5,13.5
    C 3,13 2,10.5 3,8 Z"
    fill="#1a1a24" opacity="0.93"
  />

  <!-- Internal white bristle-gap streaks — run full length of body -->
  <path d="M 7,5.2 C 15,4.6 24,5.1 31,4.8 L 33,5.6 C 24,6 15,5.5 7,6 Z"
    fill="#faf8f4" opacity="0.78"/>
  <path d="M 6,10.2 C 15,9.7 24,10.2 32,9.8 L 33.5,10.6 C 24,11.1 15,10.6 6,11 Z"
    fill="#faf8f4" opacity="0.72"/>

  <!-- Bristle tails — 5 separated strands fanning out from right end -->
  <!-- Each is a flat tapered wedge, emerging from the body right edge -->
  <!-- Tail 1: top-most -->
  <path d="M 32,3   L 55,0   56,1   32,4.8 Z" fill="#1a1a24" opacity="0.9"/>
  <!-- Tail 2: upper -->
  <path d="M 33,5.8 L 56,4.2 57,5.2 33,7.2 Z" fill="#1a1a24" opacity="0.86"/>
  <!-- Tail 3: center -->
  <path d="M 34,7.8 L 57,7.6 57,8.8 34,9   Z" fill="#1a1a24" opacity="0.88"/>
  <!-- Tail 4: lower -->
  <path d="M 33,9.8 L 56,11  57,12  33,11.2 Z" fill="#1a1a24" opacity="0.84"/>
  <!-- Tail 5: bottom-most -->
  <path d="M 32,12.2 L 54,15 55,16 32,13.8 Z" fill="#1a1a24" opacity="0.82"/>

  <!-- Thin gap lines between tails (reinforce separation) -->
  <line x1="34" y1="5"  x2="57" y2="4"  stroke="#faf8f4" stroke-width="0.5" opacity="0.55"/>
  <line x1="34" y1="10" x2="57" y2="11" stroke="#faf8f4" stroke-width="0.5" opacity="0.5"/>

  <!-- Left end slight bleed — adds painterly weight -->
  <path d="M 3,6.5 C 1,6 0,7 0.5,8 1,9 3,9.5 3,9 Z" fill="#1a1a24" opacity="0.55"/>

</svg>
