<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 14" width="32" height="14" aria-hidden="true">

  <!-- Main stroke body: crayon-like irregular silhouette -->
  <path d="
    M 2,7
    L 3,4.5 4.5,3.5 6,3 7,3.8 9,2.8 10.5,3.2 12,2.6 14,3 15.5,2.7 17,3.1 19,2.8 21,3.5 22.5,4.3 24,5.6 25.5,7
    L 25,8.6 23.5,9.8 22,10.3 20,10.7 18,10 16,10.6 14,10 12,10.7 10,10 8,10.8 6,10.3 4.5,9.4 3,8.2
    Z"
    fill="#1e1e2e"
    opacity="0.88"
  />

  <!-- Inner highlight streak — simulates crayon wax/light catching -->
  <path d="
    M 5,5.5
    C 8,4.5 12,4.8 16,4.5
    L 21,5 22,5.8
    L 21.5,6.5
    C 17,6.2 12,6.5 7,6.2
    L 5,6
    Z"
    fill="#ffffff"
    opacity="0.07"
  />

  <!-- Frayed bristles — right end -->
  <line x1="25" y1="5.8"  x2="27.5" y2="4.8"  stroke="#1e1e2e" stroke-width="0.55" stroke-linecap="round" opacity="0.65"/>
  <line x1="25.5" y1="7"  x2="28"   y2="6.8"  stroke="#1e1e2e" stroke-width="0.45" stroke-linecap="round" opacity="0.5"/>
  <line x1="25"   y1="8.5" x2="27"  y2="9.5"  stroke="#1e1e2e" stroke-width="0.5"  stroke-linecap="round" opacity="0.55"/>
  <line x1="24"   y1="5"  x2="26.5" y2="3.5"  stroke="#1e1e2e" stroke-width="0.4"  stroke-linecap="round" opacity="0.4"/>

  <!-- Frayed bristles — left end -->
  <line x1="3"  y1="5.2" x2="1"   y2="4.5"  stroke="#1e1e2e" stroke-width="0.5"  stroke-linecap="round" opacity="0.5"/>
  <line x1="3"  y1="8.5" x2="1"   y2="9.2"  stroke="#1e1e2e" stroke-width="0.45" stroke-linecap="round" opacity="0.45"/>
  <line x1="3.5" y1="7" x2="1.2"  y2="7.2"  stroke="#1e1e2e" stroke-width="0.4"  stroke-linecap="round" opacity="0.4"/>

  <!-- Fine stray fibre lines across body — adds crayon grain texture -->
  <line x1="8"  y1="3.2"  x2="8.5"  y2="10.4" stroke="#1e1e2e" stroke-width="0.3" opacity="0.12"/>
  <line x1="13" y1="2.8"  x2="13.5" y2="10.2" stroke="#1e1e2e" stroke-width="0.3" opacity="0.1"/>
  <line x1="18" y1="3"    x2="18.5" y2="10.5" stroke="#1e1e2e" stroke-width="0.3" opacity="0.1"/>

</svg>
